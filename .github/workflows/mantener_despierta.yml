# Visita la app cada 6 horas con un navegador real para que Streamlit Cloud no la duerma.
# Si ya estaba dormida, da clic en "Yes, get this app back up!" para despertarla.
name: Mantener app despierta

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visitar la app
        env:
          APP_URL: https://finanzas-familiares-saludfinanciera.streamlit.app
        run: python tareas/despertar.py
